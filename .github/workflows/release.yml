name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22: server engines require >=20 (upstream constraint, driven by
      # better-sqlite3 v12); upstream's own workflow still pins 18 and is stale.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # .NET 10 SDK is required to load the Nice3point.Revit.Sdk build tasks
      # (net10.0) used by the tests project; plugins target net8/net48.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ---------------------------------------------------------------
      # Build MCP Server (TypeScript)
      # ---------------------------------------------------------------
      - name: Build MCP Server
        working-directory: server
        run: |
          npm ci
          npm run build

      # ---------------------------------------------------------------
      # Build Plugin + CommandSet via combined solution
      # The commandset's DeployCommandSet target automatically copies
      # its output into the plugin's AddIn layout.
      # ---------------------------------------------------------------
      - name: Build Revit 2020 (.NET Framework 4.8)
        run: msbuild mcp-servers-for-revit.sln -p:Configuration="Release R20" -restore

      - name: Build Revit 2021 (.NET Framework 4.8)
        run: msbuild mcp-servers-for-revit.sln -p:Configuration="Release R21" -restore

      - name: Build Revit 2022 (.NET Framework 4.8)
        run: msbuild mcp-servers-for-revit.sln -p:Configuration="Release R22" -restore

      - name: Build Revit 2023 (.NET Framework 4.8)
        run: msbuild mcp-servers-for-revit.sln -p:Configuration="Release R23" -restore

      - name: Build Revit 2024 (.NET Framework 4.8)
        run: msbuild mcp-servers-for-revit.sln -p:Configuration="Release R24" -restore

      - name: Build Revit 2025 (.NET 8)
        run: dotnet build mcp-servers-for-revit.sln -c "Release R25"

      - name: Build Revit 2026 (.NET 8)
        run: dotnet build mcp-servers-for-revit.sln -c "Release R26"

      # ---------------------------------------------------------------
      # Create Release Assets
      # The AddIn output already contains the complete deployable layout
      # (plugin + commandset) thanks to the DeployCommandSet build target.
      # ---------------------------------------------------------------
      - name: Create release assets
        run: |
          $version = "${{ github.ref_name }}"
          $outputDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $outputDir

          $revitVersions = @(
            @{ Config = "Release R20"; Year = "2020" },
            @{ Config = "Release R21"; Year = "2021" },
            @{ Config = "Release R22"; Year = "2022" },
            @{ Config = "Release R23"; Year = "2023" },
            @{ Config = "Release R24"; Year = "2024" },
            @{ Config = "Release R25"; Year = "2025" },
            @{ Config = "Release R26"; Year = "2026" }
          )

          foreach ($rv in $revitVersions) {
            $addinDir = "plugin/bin/AddIn $($rv.Year) $($rv.Config)"
            if (Test-Path $addinDir) {
              $zipName = "$outputDir/mcp-servers-for-revit-$version-Revit$($rv.Year).zip"
              Compress-Archive -Path "$addinDir/*" -DestinationPath $zipName
              Write-Host "Created $zipName"
            } else {
              Write-Host "Warning: AddIn output not found: $addinDir"
            }
          }
        shell: pwsh

      # ---------------------------------------------------------------
      # Build the Inno Setup Windows installer (Revit 2024-2026).
      # Primes the staged layout via -RevitVersions, which rebuilds those
      # configs and compiles mcp-servers-for-revit-setup.exe.
      # ---------------------------------------------------------------
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        run: ./installer/build-installer.ps1 -RevitVersions @(2024, 2025, 2026)
        shell: pwsh

      - name: Collect installer asset
        run: |
          Copy-Item "installer/output/mcp-servers-for-revit-setup.exe" "release-assets/mcp-servers-for-revit-setup.exe"
          Write-Host "Collected installer exe into release-assets"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.zip
            release-assets/*.exe
          generate_release_notes: true
          append_body: true
          body: |
            ## Windows Installer
            **`mcp-servers-for-revit-setup.exe`** is a standard Windows installer (Revit 2024-2026): it installs the Revit plugin, lets you choose command sets, and configures AI clients (Claude Desktop, Cursor, opencode). The MCP server is bundled with the installer (no npm `npx` dependency; Node.js 20+ still required). The per-Revit-version ZIPs below remain available for manual deployment.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
